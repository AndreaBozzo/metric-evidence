[project]
name = "metric-evidence"
version = "0.1.0"
description = "Synthetic orders + dataprof evidence tables for a Power BI report"
requires-python = ">=3.12,<3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
keywords = ["power-bi", "data-quality", "dataprof", "pbip", "data-visualization"]
dependencies = [
    "dataprof==0.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pythonnet>=3.2.0",
    "ruff>=0.15",
    "ty>=0.0.91",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter owns line width; what it cannot wrap is long strings.
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
# The tests import the prep scripts by putting prep/ on sys.path.
extra-paths = ["prep"]
